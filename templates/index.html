<!DOCTYPE html>
<!--
  MT° — Chat interface (health-app reskin)
  Served at GET /chat. JSON API: POST /api/chat (see app.py).
  Design tokens live in style.css (:root + [data-theme]).
-->
<html lang="en" data-theme="light" data-lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2D6BFF" />
    <title>MT° — Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cairo:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="chat-body">

    <!-- Page-level decorative layers (never block clicks). -->
    <div class="chat-grain" aria-hidden="true"></div>
    <div class="chat-deco" aria-hidden="true">
        <div class="chat-deco-blob chat-deco-blob--tr"></div>
        <div class="chat-deco-star" aria-hidden="true">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="chatBlurSpark" x="-40%" y="-40%" width="180%" height="180%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="12" />
                    </filter>
                </defs>
                <g filter="url(#chatBlurSpark)" fill="rgba(45, 107, 255, 0.2)">
                    <ellipse cx="100" cy="100" rx="70" ry="20" />
                    <ellipse cx="100" cy="100" rx="20" ry="70" />
                </g>
            </svg>
        </div>
    </div>

    <div class="chat-page">
        <!-- Thin progress while waiting for /api/chat (indeterminate shimmer). -->
        <div class="chat-progress" id="chatProgress" aria-hidden="true"></div>

        <header class="chat-header">
            <a href="/" class="chat-brand" aria-label="Back to welcome" title="Home">
                <span class="chat-brand-box">
                    <svg class="chat-brand-heart chat-heart-pump" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <span class="chat-brand-mt">MT<sup>°</sup></span>
                </span>
                <span class="chat-brand-pulse" aria-hidden="true"></span>
            </a>

            <h1 class="chat-header-title" data-i18n="chat">Chat</h1>

            <div class="header-actions">
                <button type="button" class="icon-btn lang-toggle" id="langToggle"
                        aria-label="Switch language"
                        data-i18n-title="ariaLang">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span class="lang-label" id="langLabel">AR</span>
                </button>

                <button type="button" class="icon-btn voice-toggle" id="voiceToggle"
                        aria-label="Toggle voice replies">
                    <svg class="speaker-icon-on" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                    <svg class="speaker-icon-off" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <line x1="23" y1="9"  x2="17" y2="15"/>
                        <line x1="17" y1="9"  x2="23" y2="15"/>
                    </svg>
                </button>

                <button type="button" class="icon-btn theme-toggle" id="themeToggle"
                        aria-label="Toggle theme"
                        data-i18n-title="ariaTheme">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <line x1="12" y1="2"  x2="12" y2="4"/>
                        <line x1="12" y1="20" x2="12" y2="22"/>
                        <line x1="2"  y1="12" x2="4"  y2="12"/>
                        <line x1="20" y1="12" x2="22" y2="12"/>
                        <line x1="4.93"  y1="4.93"  x2="6.34"  y2="6.34"/>
                        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
                        <line x1="4.93"  y1="19.07" x2="6.34"  y2="17.66"/>
                        <line x1="17.66" y1="6.34"  x2="19.07" y2="4.93"/>
                    </svg>
                </button>

                <button type="button" class="reset-chip" id="resetBtn" data-i18n="reset"
                        aria-label="Reset conversation">Reset</button>
            </div>
        </header>

        <div class="disclaimer-wrap" role="note">
            <span class="disclaimer-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </span>
            <div class="disclaimer" data-i18n-html="disclaimer">
                This chatbot is for general information only and is <strong>not</strong>
                a substitute for professional medical advice.
            </div>
        </div>

        <main class="chat" id="chat" aria-live="polite" aria-label="Chat messages">
            <div class="day-divider"><span id="timestamp">TODAY</span></div>

            <div class="message bot" id="greetingMessage">
                <span class="online-dot" aria-hidden="true"></span>
                <div class="bubble greeting-bubble">
                    <span class="accent" data-i18n="greetingHello">Welcome!</span><span data-i18n="greetingRest"> I'm MT, your medical assistant. How can I help you feel better today?</span>
                </div>
            </div>
        </main>

        <div class="suggestions" id="suggestions" aria-label="Quick suggestions">
            <button type="button" class="chip" data-i18n="chip1">I have a headache</button>
            <button type="button" class="chip" data-i18n="chip2">My stomach hurts</button>
            <button type="button" class="chip" data-i18n="chip3">I feel dizzy</button>
            <button type="button" class="chip" data-i18n="chip4">Can't sleep</button>
        </div>

        <!-- Floating dark composer — signature health-app pattern -->
        <div class="floating-bar-wrap">
            <form class="composer" id="composer" autocomplete="off" novalidate>
                <button type="button" class="mic-btn" id="micBtn" aria-label="Voice input"
                        title="Voice input">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2" width="6" height="12" rx="3"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8"  y1="23" x2="16" y2="23"/>
                    </svg>
                </button>

                <input type="text" id="input" class="composer-input"
                       placeholder="Type here..."
                       data-i18n-placeholder="placeholderDefault"
                       aria-label="Your message" maxlength="2000" />

                <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
                    <svg class="send-icon-plane" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
